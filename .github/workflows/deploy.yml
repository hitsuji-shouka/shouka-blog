name: Deploy Blog

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      observability:
        description: Start optional Langfuse services
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      skip_health:
        description: Skip public HTTPS health check
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: deploy-blog
  cancel-in-progress: false

jobs:
  verify:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        run: npm --prefix frontend audit --audit-level=high

      - name: Install browser runtime
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Run release verification
        run: bash scripts/verify-release.sh

      - name: Validate Caddyfile
        run: |
          docker run --rm \
            -e SITE_DOMAIN=localhost \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2 caddy validate --config /etc/caddy/Caddyfile

      - name: Smoke test Caddy reverse proxy
        timeout-minutes: 15
        run: APP_VERSION="${{ github.sha }}" bash scripts/smoke-caddy-proxy.sh

      - name: Build deployment Docker image
        run: docker build --build-arg APP_VERSION="${{ github.sha }}" -t shouka-blog:ci .

      - name: Smoke test deployment Docker image
        run: |
          docker run --rm -d \
            --name shouka-blog-ci \
            -p 18080:8000 \
            -e SITE_DOMAIN=http://127.0.0.1:18080 \
            -e BLOG_DEEPSEEK_KEY= \
            -e BLOG_EMBED_KEY= \
            shouka-blog:ci

          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:18080/api/health >/dev/null; then
              break
            fi
            sleep 1
          done

          if ! curl --fail --silent --show-error --max-time 5 http://127.0.0.1:18080/api/health >/dev/null; then
            docker ps -a --filter name=shouka-blog-ci
            docker logs shouka-blog-ci
            exit 1
          fi

          EXPECTED_APP_VERSION="${{ github.sha }}" bash scripts/verify-public-site.sh http://127.0.0.1:18080
          bash scripts/check-frontend-render.sh http://127.0.0.1:18080

      - name: Stop deployment Docker image
        if: always()
        run: docker stop shouka-blog-ci || true

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    timeout-minutes: 60
    env:
      DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        run: bash scripts/check-deploy-secrets.sh

      - name: Validate DEPLOY_ENV
        if: ${{ env.DEPLOY_ENV != '' }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/deploy.env"' EXIT
          env_check_args=(bash scripts/check-env-file.sh --file "$RUNNER_TEMP/deploy.env")
          if [[ "${{ inputs.observability }}" == "true" ]]; then
            env_check_args+=(--observability)
          fi
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/deploy.env"
          chmod 600 "$RUNNER_TEMP/deploy.env"
          "${env_check_args[@]}"

      - name: Check remote server
        run: bash scripts/check-remote-server.sh --domain-routing

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Check server environment
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH'"

          if [[ -n "$DEPLOY_ENV" ]]; then
            printf '%s\n' "$DEPLOY_ENV" | ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
              "tmp_env='$DEPLOY_PATH/.env.next'; trap 'rm -f \"\$tmp_env\"' EXIT; cat > \"\$tmp_env\" && chmod 600 \"\$tmp_env\" && if test -f '$DEPLOY_PATH/.env'; then cp '$DEPLOY_PATH/.env' '$DEPLOY_PATH/.env.previous' && chmod 600 '$DEPLOY_PATH/.env.previous'; fi && mv '$DEPLOY_PATH/.env.next' '$DEPLOY_PATH/.env' && tmp_env= && chmod 600 '$DEPLOY_PATH/.env'"
          fi

          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "test -f '$DEPLOY_PATH/.env'"

      - name: Sync files to server
        run: |
          rsync -az --delete \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '.deploy.lock' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.claude' \
            --exclude '.agents' \
            --exclude '.worktrees' \
            --exclude '.DS_Store' \
            --exclude '*.log' \
            --exclude 'backend/.venv' \
            --exclude 'frontend/dist' \
            --exclude 'frontend/node_modules' \
            -e "ssh -i ~/.ssh/deploy_key -p ${DEPLOY_PORT:-22}" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Run remote deploy
        run: |
          flags=()
          if [[ "${{ inputs.observability }}" == "true" ]]; then
            flags+=(--observability)
          fi
          if [[ "${{ inputs.skip_health }}" == "true" ]]; then
            flags+=(--skip-health)
          fi

          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && APP_VERSION='${{ github.sha }}' bash scripts/deploy.sh ${flags[*]}"

      - name: Set up Node.js for public browser checks
        if: ${{ github.event.inputs.skip_health != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install browser check dependencies
        if: ${{ github.event.inputs.skip_health != 'true' }}
        working-directory: frontend
        run: npm ci

      - name: Install public browser runtime
        if: ${{ github.event.inputs.skip_health != 'true' }}
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Verify deployed public site from runner
        if: ${{ github.event.inputs.skip_health != 'true' }}
        run: |
          SITE_DOMAIN="$(
            ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
              "awk -F= '/^SITE_DOMAIN=/ { gsub(/^[\"'\\'' ]+|[\"'\\'' ]+$/, \"\", \$2); print \$2; exit }' '$DEPLOY_PATH/.env'"
          )"
          SITE_DOMAIN="${SITE_DOMAIN//$'\r'/}"
          test -n "$SITE_DOMAIN"
          case "$SITE_DOMAIN" in
            http://*|https://*) SITE_ORIGIN="${SITE_DOMAIN%/}" ;;
            *) SITE_ORIGIN=https://"$SITE_DOMAIN" ;;
          esac

          EXPECTED_APP_VERSION="${{ github.sha }}" EXPECT_CADDY_HEADERS=1 bash scripts/verify-public-site.sh "$SITE_ORIGIN"
          bash scripts/check-frontend-render.sh "$SITE_ORIGIN"

      - name: Collect remote diagnostics
        if: ${{ failure() }}
        run: |
          if [[ ! -f ~/.ssh/deploy_key ]]; then
            echo "SSH was not configured; skipping remote diagnostics."
            exit 0
          fi

          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && docker compose ps" || true
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && docker compose logs --tail=120 app" || true
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && docker compose logs --tail=120 caddy" || true
