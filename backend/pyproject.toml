[project]
name = "shoka-blog-backend"
version = "0.1.0"
description = "shoka blog core FastAPI service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-frontmatter>=1.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=2.4.6",
    "openai>=2.41.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
