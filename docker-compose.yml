services:
  app:
    build: .
    restart: unless-stopped
    expose: ["8000"]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
  langfuse-db:
    image: postgres:16
    restart: unless-stopped
    environment: { POSTGRES_USER: langfuse, POSTGRES_PASSWORD: langfuse, POSTGRES_DB: langfuse }
    volumes: [langfuse_pg:/var/lib/postgresql/data]
  langfuse:
    image: langfuse/langfuse:2
    restart: unless-stopped
    ports: ["3000:3000"]
    depends_on: [langfuse-db]
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_SECRET: mysecretmysecretmysecretmysecre1
      SALT: saltsaltsaltsaltsaltsaltsaltsal1
      NEXTAUTH_URL: http://localhost:3000
      # 首启自动建组织/项目/用户与 trace key（生产请改强密码）
      LANGFUSE_INIT_ORG_ID: shouka
      LANGFUSE_INIT_PROJECT_ID: blog
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-11111111-1111-1111-1111-111111111111
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-11111111-1111-1111-1111-111111111111
      LANGFUSE_INIT_USER_EMAIL: a@b.com
      LANGFUSE_INIT_USER_PASSWORD: password123
volumes:
  caddy_data:
  langfuse_pg:
